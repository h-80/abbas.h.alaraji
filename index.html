<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عباس الاعرجي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--card:#1c1c1c;--ink:#f1f1f1;--muted:#aaaaaa;
  --line:#303030;--h1:#1877f2;--h2:#0d5fd0;--ring:#0f0f0f;
  --gold:#d4af37;--shadow:0 1px 2px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px);
}
.header{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;text-align:center;padding:0;height:200px}
.header.img{
  background-size:cover;background-position:center;position:relative;
  height:220px;padding:calc(env(safe-area-inset-top,0px)) 0 0 0;
}
.header.img::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.25));
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
.profile{
  display:flex;align-items:center;gap:16px;
  margin-top:0;padding-top:20px;margin-bottom:22px;
  position:relative;z-index:2;
}
.avatar{
  flex:none;width:104px;height:104px;border-radius:50%;
  border:5px solid var(--ring);
  background:linear-gradient(135deg,#42a5ff,#1877f2);
  color:#fff;display:grid;place-items:center;
  font-size:2.4rem;font-weight:700;
  box-shadow:var(--shadow);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who{padding-top:0}
.who h2{margin:0 0 4px;font-size:1.25rem}
.who p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.6}
.links{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.card{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:12px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);color:inherit;text-decoration:none;
  transition:transform .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{flex:none;width:42px;height:42px;display:grid;place-items:center;color:var(--gold)}
.ic svg{width:32px;height:32px;display:block}
.ic img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:block}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:1.02rem;font-weight:700}
.txt span{color:var(--muted);font-size:.85rem}
.chev{flex:none;width:20px;height:20px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="header"></header>
<main class="wrap">
  <section class="profile">
    <div class="avatar" id="avatar"></div>
    <div class="who"><h2 id="name"></h2><p id="bio"></p></div>
  </section>
  <nav class="links" id="links"></nav>
</main>
<script>
// ====== عدّل هنا ======
var CONFIG = {
  pageTitle: "عباس الاعرجي",
  name: "عباس الاعرجي",
  bio: "مواقع التواصل الاجتماعي",
  headerImage: "https://e.top4top.io/p_3923h9t4h1.jpg",
  avatar: "https://f.top4top.io/p_3923zwtcn2.jpg",
  links: [
    {
      k:"facebook",
      label:"فيسبوك", sub:"تابعني على فيسبوك",
      app:"fb://facewebmodal/f?href=https://www.facebook.com/abbas.h.alaraji",
      web:"https://www.facebook.com/abbas.h.alaraji"
    },
    {
      k:"instagram",
      label:"إنستغرام", sub:"صور وقصص يومية",
      app:"instagram://user?username=abbas.h.alaraji",
      web:"https://www.instagram.com/abbas.h.alaraji"
    },
    {
      k:"youtube",
      label:"يوتيوب", sub:"شاهد قناتي",
      app:"vnd.youtube://www.youtube.com/@abbas.h.alaraji",
      web:"https://www.youtube.com/@abbas.h.alaraji"
    },
    {
      k:"tiktok",
      label:"تيك توك", sub:"مقاطع قصيرة",
      app:"snssdk1233://user/profile/abbas.h.alaraji",
      web:"https://www.tiktok.com/@abbas.h.alaraji"
    },
    {
      k:"website",
      label:"الموقع الإلكتروني", sub:"زيارة الموقع الرسمي",
      web:"https://h-80.github.io/abbasalaraji/"
    }
  ]
};
// =======================
var ICONS={
facebook:{s:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/></svg>'},
instagram:{s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>'},
youtube:{s:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="5" width="20" height="14" rx="4.5"/><path d="M10 9l5 3-5 3z" fill="#0f0f0f"/></svg>'},
tiktok:{s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.4 2.5 2 4 4.5 4.2"/></svg>'},
x:{s:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3l-6.6 7.5L22 21h-6l-4.7-6.1L5.9 21h-3l7-8L2.4 3h6.2l4.2 5.6zm-1 16.2h1.7L7.7 4.7H5.9z"/></svg>'},
whatsapp:{s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M9.2 8.5c0 3.3 2.8 6.1 6.1 6.1l.9-1.4-1.9-1-.9.8c-.9-.4-1.7-1.2-2.1-2.1l.8-.9-1-1.9z" fill="currentColor" stroke="none"/></svg>'},
telegram:{s:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 4L3 11l5 2 2 6 3-4 5 4z"/></svg>'},
link:{s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'}
};
var CH='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}

function openSmart(appUrl, webUrl){
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!isMobile || !appUrl){
    window.location.href = webUrl;
    return;
  }
  var t0 = Date.now();
  var timer = setTimeout(function(){
    if(Date.now() - t0 < 2000 && !document.hidden){
      window.location.href = webUrl;
    }
  }, 1300);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearTimeout(timer);
  }, {once:true});
  window.location.href = appUrl;
}

document.title=CONFIG.pageTitle;
if(CONFIG.headerImage){
  var h=document.querySelector(".header");
  h.classList.add("img");
  h.style.backgroundImage="url("+CONFIG.headerImage+")";
}
document.getElementById("name").textContent=CONFIG.name;
document.getElementById("bio").textContent=CONFIG.bio;
var av=document.getElementById("avatar");
if(CONFIG.avatar){av.innerHTML='<img alt="" src="'+CONFIG.avatar+'">'}
else{av.textContent=(CONFIG.name||"?").trim().charAt(0)}

document.getElementById("links").innerHTML=CONFIG.links.map(function(l,idx){
  var iconHTML;
  if(l.k==="website"){
    iconHTML = CONFIG.avatar
      ? '<img src="'+CONFIG.avatar+'" alt="">'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>';
  } else {
    var i=ICONS[l.k]||ICONS.link;
    iconHTML = i.s;
  }
  return '<a class="card" data-idx="'+idx+'" href="'+esc(l.web)+'">'
   +'<span class="ic">'+iconHTML+'</span>'
   +'<span class="txt"><b>'+esc(l.label)+'</b><span>'+esc(l.sub||"")+'</span></span>'+CH+'</a>';
}).join("");

document.querySelectorAll(".card").forEach(function(a){
  a.addEventListener("click", function(e){
    e.preventDefault();
    var l = CONFIG.links[+this.dataset.idx];
    openSmart(l.app, l.web);
  });
});
</script>
</body>
</html>
